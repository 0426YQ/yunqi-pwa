<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7a8bf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="云琪工作台">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>云琪工作台</title>
<style>
:root{
  /* ---- 粉 × 黄 马卡龙渐变体系 ---- */
  --pink:#f9c9d6;        /* 马卡龙粉 */
  --pink-light:#ffe3ec;  /* 浅粉 */
  --pink-deep:#ef8ba8;   /* 玫瑰粉 */
  --pink-rose:#ee6f92;   /* 主按钮玫粉 */
  --butter:#ffe9a8;      /* 黄油黄 */
  --butter-deep:#ffd66b; /* 蜜桃黄 */
  --apricot:#ffcf9e;     /* 杏橘 */
  --cream:#fffaf0;       /* 奶白 */
  --pink-bg:#fdf1f5;
  --white:#ffffff;
  --text:#9a6b78;
  --text-dark:#6b4a52;
  --shadow:0 4px 16px rgba(238,111,146,.13);
  --shadow-soft:0 2px 10px rgba(255,196,120,.16);
  /* 渐变预设 */
  --g-pink:linear-gradient(135deg,#f9a8c0 0%,#ffc8d8 100%);
  --g-butter:linear-gradient(135deg,#ffd66b 0%,#ffe9a8 100%);
  --g-pink-butter:linear-gradient(135deg,#ffb3c9 0%,#ffd9b0 55%,#ffeda8 100%);
  --g-card:linear-gradient(150deg,#fffaf6 0%,#fff3f7 55%,#fffaea 100%);
  --g-page:linear-gradient(165deg,#fde6ee 0%,#fdf1f5 32%,#fff8ec 68%,#fffbe8 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,sans-serif;
  background:var(--g-page);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  font-size:15px;
  position:relative;
}
/* 柔光光斑：粉 + 黄 双色晕染 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 8% 4%,rgba(255,210,120,.28) 0%,transparent 42%),
    radial-gradient(circle at 92% 12%,rgba(249,168,192,.26) 0%,transparent 45%),
    radial-gradient(circle at 78% 88%,rgba(255,226,150,.24) 0%,transparent 46%),
    radial-gradient(circle at 12% 78%,rgba(255,190,210,.22) 0%,transparent 44%);
}
#app{position:relative;z-index:1;}
/* ---------- 布局 ---------- */
#app{display:flex;min-height:100vh;width:100%;overflow-x:hidden;}
/* 侧边竖向导航 */
nav{
  width:56px;
  background:linear-gradient(180deg,rgba(255,250,244,.88) 0%,rgba(255,243,248,.86) 55%,rgba(255,250,235,.88) 100%);
  backdrop-filter:blur(12px);
  border-right:1px solid rgba(255,214,107,.35);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 0;
  gap:2px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  flex-shrink:0;
  min-width:56px;
  z-index:20;
}
.nav-item{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;border-radius:14px;
  cursor:pointer;transition:.2s;
  position:relative;
}
.nav-item:hover{background:rgba(255,227,236,.75);}
.nav-item.active{background:var(--g-pink-butter);box-shadow:0 4px 14px rgba(238,111,146,.28);}
.nav-logo{font-size:24px;margin-bottom:6px;filter:drop-shadow(0 2px 5px rgba(255,196,120,.4));}
.quote .lotus{font-size:13px;margin-right:2px;}
main{flex:1;min-width:0;padding:14px 14px 40px;max-width:520px;margin:0 auto;width:100%;}
/* ---------- 顶部 ---------- */
header{text-align:center;padding:6px 0 4px;}
#clock{font-size:34px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;
  background:linear-gradient(120deg,#e8628c 0%,#f0906e 55%,#e8a83c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
#dateStr{font-size:13px;color:#c6978f;margin-top:2px;}
.header-top{position:relative;}
#checkinBtn{
  position:absolute;top:0;right:0;
  background:linear-gradient(135deg,#ee6f92 0%,#f58a76 55%,#f7b24e 100%);
  color:#fff;border:none;border-radius:20px;
  padding:8px 15px;font-size:13px;font-weight:700;
  box-shadow:0 5px 14px rgba(238,111,146,.38),0 2px 6px rgba(255,190,90,.3);
  cursor:pointer;letter-spacing:.5px;
}
#checkinBtn.done{background:linear-gradient(135deg,#d9d2cc,#cfc6bf);box-shadow:none;}
/* 治愈文案 */
.quote{
  margin:12px 0 16px;
  background:linear-gradient(135deg,#fffdf8 0%,#fff5f8 50%,#fffbec 100%);
  border:1px solid rgba(255,214,107,.4);
  border-radius:20px;
  padding:14px 16px;
  box-shadow:var(--shadow-soft);
  text-align:center;
}
.quote .zh{font-size:14px;color:var(--text-dark);font-weight:700;}
.quote .en{font-size:12px;color:#c39a92;margin-top:4px;font-style:italic;}
/* ---------- 卡片 ---------- */
.card{
  background:linear-gradient(160deg,#ffffff 0%,#fffcf8 55%,#fffaf0 100%);
  border:1px solid rgba(255,224,190,.55);
  border-radius:22px;
  padding:16px;
  box-shadow:0 6px 20px rgba(238,111,146,.09),0 2px 8px rgba(255,196,120,.12);
  margin-bottom:14px;
}
.card h2{font-size:16px;color:var(--text-dark);display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:800;}
.card h2::before{content:'';width:4px;height:15px;border-radius:3px;background:var(--g-pink-butter);flex-shrink:0;}
.page-title{font-size:20px;font-weight:700;color:var(--text-dark);margin:4px 0 12px;display:flex;align-items:center;gap:8px;}
/* 数据卡片 4 宫格 */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.stat{
  background:linear-gradient(150deg,#fff8f2 0%,#fff0f5 55%,#fff9ea 100%);
  border:1px solid rgba(255,214,170,.5);
  border-radius:18px;
  padding:12px 10px;
  text-align:center;
  box-shadow:0 2px 8px rgba(255,196,120,.1);
}
.stat .label{font-size:11px;color:#c4917f;font-weight:600;}
.stat .num{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;
  background:linear-gradient(120deg,#e8628c 0%,#f0906e 60%,#e0a133 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.stat .num small{font-size:11px;font-weight:600;}
/* 列表 */
.list{display:flex;flex-direction:column;gap:8px;}
.row{
  background:linear-gradient(150deg,#fffdf9 0%,#fff8fa 60%,#fffcef 100%);
  border:1px solid rgba(255,214,170,.45);
  border-radius:15px;
  padding:10px 12px;
  display:flex;align-items:center;gap:8px;
  font-size:13px;
  animation:fadeIn .25s;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.row .grow{flex:1;min-width:0;}
.row .t-main{color:var(--text-dark);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .t-sub{font-size:11px;color:#c4917f;margin-top:2px;}
.row .ops{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{
  border:none;background:linear-gradient(135deg,#ffe3ec,#ffeecd);color:#e07f9e;
  width:26px;height:26px;border-radius:9px;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn.del{background:linear-gradient(135deg,#ffe0e0,#ffe8d8);color:#e87878;}
.icon-btn.done-btn{background:linear-gradient(135deg,#dcf5e6,#f0f9dc);color:#4caf7d;}
/* 表单 */
.form{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.form input,.form select,.form textarea{
  border:1.5px solid rgba(255,204,170,.75);
  border-radius:13px;padding:9px 11px;font-size:13px;
  background:linear-gradient(150deg,#fffdf9,#fff9f2);
  color:var(--text-dark);outline:none;
  min-width:0;flex:1;font-family:inherit;
}
.form input:focus,.form select:focus,.form textarea:focus{border-color:#f5a8bf;box-shadow:0 0 0 3px rgba(245,168,191,.16);}
.form .btn-main,.btn-main{
  background:linear-gradient(135deg,#f48fb1 0%,#f79a8e 52%,#ffc25e 100%);
  color:#fff;border:none;border-radius:13px;padding:9px 16px;
  font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  box-shadow:0 3px 10px rgba(238,111,146,.24);
}
.form .btn-main:active,.btn-main:active{transform:scale(.97);}
/* 添加按钮 */
.add-row{display:flex;justify-content:center;margin-top:10px;}
.add-btn{
  background:linear-gradient(150deg,#fffdf9,#fff7ee);
  border:1.5px dashed #f3a6bb;
  color:#e0708e;border-radius:14px;padding:9px 22px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}
.add-btn:active{background:linear-gradient(135deg,#ffe9f0,#fff3d9);}
/* 进度条 */
.progress{height:10px;background:linear-gradient(90deg,#ffe8ef,#fff4dd);border-radius:6px;overflow:hidden;margin-top:8px;}
.progress>div{height:100%;background:linear-gradient(90deg,#f9a8c2 0%,#ffb58c 55%,#ffd166 100%);border-radius:6px;transition:width .5s ease;}
.progress-text{font-size:11px;color:#c4917f;margin-top:4px;text-align:center;}
/* 标签 */
.tag{display:inline-block;background:linear-gradient(135deg,#ffe6ee,#fff2d8);color:#dd7a97;font-size:10px;padding:2px 8px;border-radius:8px;margin-right:6px;font-weight:700;}
.tag.src{background:linear-gradient(135deg,#eef3ff,#f5f0ff);color:#7a8ec9;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.pill{
  border:1px solid rgba(255,208,175,.8);background:linear-gradient(150deg,#fffdfa,#fff9f1);
  color:var(--text);border-radius:14px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:600;
}
.pill.active{background:linear-gradient(135deg,#f38bab 0%,#f9a58c 55%,#ffc85e 100%);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(238,111,146,.24);}
/* 内容条目（资讯类） */
.info-item{
  background:linear-gradient(150deg,#fffdf9 0%,#fff8fa 60%,#fffcef 100%);
  border-radius:16px;padding:11px 13px;margin-bottom:8px;
  border:1px solid rgba(255,214,170,.5);
}
.info-item .i-title{font-size:13px;font-weight:700;color:var(--text-dark);}
.info-item .i-desc{font-size:12px;color:#a87b78;margin-top:3px;line-height:1.55;}
.info-item .i-src{font-size:10px;color:#bda49a;margin-top:5px;}
.jump-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.jump{background:linear-gradient(135deg,#ffe6ee,#fff3da);color:#e0708e;font-size:11px;font-weight:700;text-decoration:none;
  border:none;cursor:pointer;font-family:inherit;
  border-radius:10px;padding:4px 10px;display:inline-block;}
.jump:active{background:linear-gradient(135deg,#fbd5e2,#ffe9c0);}
/* 展开详情 */
.detail{background:linear-gradient(150deg,#fffdf8,#fff8ee);border:1px dashed rgba(255,204,160,.9);border-radius:13px;
  padding:9px 11px;margin-top:8px;font-size:12px;color:#a87b78;line-height:1.7;}
.detail b{color:var(--text-dark);}
.row.clickable{cursor:pointer;}
.row .caret{color:#d3a8b5;font-size:11px;transform:rotate(0deg);transition:.2s;}
.row.open .caret{transform:rotate(180deg);}
/* 目标卡 */
.goal-card{background:linear-gradient(150deg,#fff9f3 0%,#fff1f6 55%,#fffaeb 100%);border:1px solid rgba(255,208,170,.6);
  border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(255,196,120,.12);}
.goal-card .g-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--text-dark);}
.goal-card .g-sub{font-size:11px;color:#c4917f;margin-top:4px;}
.ring{display:flex;align-items:center;gap:12px;}
.ring svg{flex-shrink:0;}
/* 历史筛选 */
.hist-item{background:linear-gradient(150deg,#fffdf9,#fff8fa 65%,#fffcef);border:1px solid rgba(255,214,170,.45);border-radius:15px;
  padding:10px 12px;margin-bottom:8px;}
.hist-item .h-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text-dark);}
.hist-item .h-body{font-size:12px;color:#a87b78;margin-top:6px;line-height:1.8;}
.hist-item .h-body .done{color:#4caf7d;}
.hist-item .h-body .undone{color:#c2899a;}
.mini-btn{font-size:11px;padding:4px 10px;border-radius:10px;background:linear-gradient(150deg,#fffdfa,#fff8f0);color:#c0808f;
  border:1px solid rgba(255,208,175,.9);cursor:pointer;font-family:inherit;font-weight:600;}
.mini-btn:active{background:linear-gradient(135deg,#ffe9f0,#fff3d9);}
/* 记账：金额大输入 + 分类网格 */
.amt-box{display:flex;align-items:center;gap:6px;background:linear-gradient(150deg,#fffdf9,#fff7f0);border:1.5px solid rgba(255,204,170,.85);
  border-radius:18px;padding:12px 16px;margin-bottom:12px;box-shadow:inset 0 1px 4px rgba(255,196,120,.1);}
.amt-box .cur{font-size:20px;font-weight:800;color:#e8999f;}
.amt-box input{flex:1;border:none;outline:none;background:transparent;font-size:28px;font-weight:800;
  color:var(--text-dark);font-variant-numeric:tabular-nums;}
.amt-box input::placeholder{color:#e9c7d1;}
.sec-label{font-size:11px;color:#c2899a;margin:2px 0 8px 2px;font-weight:600;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:15px;
  background:linear-gradient(150deg,#fffdfa,#fff9f2);border:1.5px solid rgba(255,226,190,.4);cursor:pointer;transition:.16s;}
.cat .ce{font-size:19px;line-height:1;}
.cat .cn{font-size:10px;color:#a97b8a;font-weight:600;}
.cat.on{background:linear-gradient(150deg,#ffdbe8 0%,#ffe7cf 60%,#fff3c4 100%);border-color:#f5a3bb;box-shadow:0 3px 10px rgba(238,111,146,.18);transform:translateY(-1px);}
.cat.on .cn{color:#d2537a;font-weight:800;}
.cat:active{transform:scale(.95);}
/* 首页目标浏览 / 进度浏览 */
.seg{display:flex;background:linear-gradient(135deg,#fff1f6,#fff7e4);border-radius:12px;padding:3px;gap:3px;border:1px solid rgba(255,214,170,.45);}
.seg-i{font-size:11px;padding:4px 10px;border-radius:9px;color:#c2899a;cursor:pointer;transition:.2s;font-weight:600;}
.seg-i,.fin-seg-i{font-size:11px;padding:4px 10px;border-radius:9px;color:#c2899a;cursor:pointer;transition:.2s;font-weight:600;flex:1;text-align:center;}
.seg-i.on,.fin-seg-i.on{background:linear-gradient(135deg,#fda7c0,#ffcb8f);color:#fff;box-shadow:0 3px 9px rgba(238,111,146,.26);}
.goal-sum{display:flex;gap:8px;margin-bottom:10px;}
.goal-sum .gs{flex:1;background:linear-gradient(150deg,#fff9f3,#fff3f8 60%,#fffbea);border:1px solid rgba(255,214,170,.55);
  border-radius:14px;padding:8px 4px;text-align:center;}
.goal-sum .gs b{display:block;font-size:17px;font-weight:800;
  background:linear-gradient(120deg,#e8628c,#f0906e 60%,#e0a133);-webkit-background-clip:text;background-clip:text;color:transparent;}
.goal-sum .gs span{font-size:10px;color:#c4917f;}
.row.slot-empty{background:linear-gradient(150deg,#fffdfa,#fff9ee);border:1.5px dashed rgba(255,200,160,.95);cursor:pointer;}
.row.slot-empty:active{background:linear-gradient(135deg,#ffe9f0,#fff3d9);}
.go-row,.pg-row{background:linear-gradient(150deg,#fffdf9,#fff9f2);border:1px solid rgba(255,214,170,.5);border-radius:15px;padding:9px 11px;margin-bottom:8px;}
.go-row.ok{background:linear-gradient(150deg,#f5fcf7,#f0faea 55%,#fdfbe6);border-color:rgba(127,191,154,.5);}
.go-head,.pg-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--text-dark);}
.go-pct{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;
  background:linear-gradient(120deg,#e8628c,#f0906e 60%,#e0a133);-webkit-background-clip:text;background-clip:text;color:transparent;}
.go-sub{font-size:11px;color:#b58a80;margin-top:4px;line-height:1.6;}
.go-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.chip{font-size:11px;padding:5px 11px;border-radius:20px;background:linear-gradient(135deg,#ffe9f1,#fff4dd);color:#c47b90;
  border:1px solid rgba(255,208,175,.85);cursor:pointer;font-weight:600;}
.chip:active{background:linear-gradient(135deg,#fbd5e2,#ffe9c0);}

.search-input{width:100%;border:1.5px solid rgba(255,204,170,.75);border-radius:13px;padding:9px 12px;font-size:13px;background:linear-gradient(150deg,#fffdf9,#fff8f0);outline:none;margin-bottom:10px;color:var(--text-dark);}
.empty{text-align:center;color:#d4a89e;font-size:12px;padding:14px 0;}
.toast{
  position:fixed;left:50%;bottom:60px;transform:translateX(-50%);
  background:linear-gradient(135deg,rgba(238,111,146,.95),rgba(247,160,120,.95));
  color:#fff;font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:16px;z-index:99;
  box-shadow:0 6px 18px rgba(238,111,146,.3);
  animation:fadeIn .2s;pointer-events:none;white-space:nowrap;
}
.hint{font-size:11px;color:#c9a196;margin-top:8px;line-height:1.6;}
.checked .t-main{text-decoration:line-through;color:#c9a196;}
.streak-badge{background:linear-gradient(135deg,#ffcf6b,#ff9a9e);color:#fff;font-size:11px;border-radius:10px;padding:4px 11px;font-weight:700;box-shadow:0 3px 9px rgba(255,180,100,.3);}
.nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.nav-card{
  background:linear-gradient(150deg,#fff9f3 0%,#fff2f7 55%,#fffbeb 100%);
  border:1px solid rgba(255,214,170,.5);
  border-radius:17px;padding:12px 6px;text-align:center;cursor:pointer;
  transition:.15s;box-shadow:0 2px 9px rgba(255,196,120,.12);
}
.nav-card:active{transform:scale(.96);}
.nav-card .e{font-size:24px;}
.nav-card .n{font-size:11px;color:var(--text-dark);margin-top:6px;font-weight:700;}
.nav-card .v{font-size:11px;color:#e0708e;margin-top:3px;font-weight:800;}
@media(min-width:600px){ main{max-width:520px;} }
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
/* ================= 云端同步（Supabase） ================= */
const SYNC_CFG_KEY='yunqi_sync_cfg';
let SYNC_CFG=JSON.parse(localStorage.getItem(SYNC_CFG_KEY)||'null')||{url:'',key:'',uid:'yunqi'};
let SYNC_LOG=JSON.parse(localStorage.getItem('yunqi_sync_log')||'[]');
let pushTimer=null;
function logSync(msg,type='info'){
  SYNC_LOG.unshift({time:new Date().toLocaleString('zh-CN',{hour12:false}),msg,type});
  SYNC_LOG=SYNC_LOG.slice(0,60);
  localStorage.setItem('yunqi_sync_log',JSON.stringify(SYNC_LOG));
}
function syncReady(){return SYNC_CFG.url&&SYNC_CFG.key;}
async function pushCloud(silent){
  if(!syncReady()){if(!silent)toast('请先在 ⚙️ 设置中配置 Supabase');return;}
  try{
    const res=await fetch(SYNC_CFG.url.replace(/\/$/,'')+'/rest/v1/yunqi_data',
      {method:'POST',
       headers:{'apikey':SYNC_CFG.key,'Authorization':'Bearer '+SYNC_CFG.key,
        'Content-Type':'application/json','Prefer':'resolution=merge-deduplicate,return=minimal'},
       body:JSON.stringify([{uid:SYNC_CFG.uid,data:DB,updated_at:new Date().toISOString(),device:navigator.userAgent.slice(0,60)}])});
    if(!res.ok)throw new Error('HTTP '+res.status);
    DB._lastPush=new Date().toISOString();saveLocal();
    logSync('⬆️ 已上传本地数据到云端','ok');if(!silent)toast('已同步到云端 ☁️');
  }catch(e){logSync('⬆️ 上传失败：'+e.message,'err');if(!silent)toast('同步失败：'+e.message);}
}
async function pullCloud(silent){
  if(!syncReady()){if(!silent)toast('请先在 ⚙️ 设置中配置 Supabase');return;}
  try{
    const res=await fetch(SYNC_CFG.url.replace(/\/$/,'')+'/rest/v1/yunqi_data?uid=eq.'+encodeURIComponent(SYNC_CFG.uid)+'&order=updated_at.desc&limit=1',
      {headers:{'apikey':SYNC_CFG.key,'Authorization':'Bearer '+SYNC_CFG.key}});
    if(!res.ok)throw new Error('HTTP '+res.status);

      const cloud=rows[0].data, cloudT=rows[0].updated_at, localT=DB._lastPush||'';

/* 带超时的 fetch（避免接口被墙时一直卡在"获取中"） */
function fetchT(url,opt={},ms=4000){
  return Promise.race([
    fetch(url,{...opt,cache:'no-store'}),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('超时')),ms))
  ]);
}
function decodeGbk(buf){try{return new TextDecoder('gbk').decode(buf);}catch(e){return new TextDecoder().decode(buf);}}

async function fetchGold(){
  if(GOLD.updating)return false;
  GOLD.updating=true;GOLD.err='';
  let got=false;
  /* ① 主源：腾讯行情（国内可直连 + 支持 CORS） */
  try{
    const r=await fetchT('https://qt.gtimg.cn/q=hf_XAU,hf_XAG');
    const buf=await r.arrayBuffer();
    const txt=decodeGbk(buf);
    const grab=c=>{const m=txt.match(new RegExp('v_'+c+'="([^"]*)"'));return m?m[1].split(','):null;};
    const xau=grab('hf_XAU'),xag=grab('hf_XAG');
    if(xau&&+xau[0]>0){
      GOLD.usd=(+xau[0]).toFixed(2);
      GOLD.usdChg=(+xau[1]||0).toFixed(2);
      GOLD.time=xau[6]||'';
      if(xag&&+xag[0]>0)GOLD.silver=(+xag[0]).toFixed(2);
      // 腾讯返回已含涨跌幅百分比
      GOLD.pct=GOLD.usdChg;
      got=true;GOLD.src='腾讯财经';
    }
  }catch(e){GOLD.err='主源'+e.message;}
  /* ② 汇率：jsDelivr（国内友好）→ er-api */
  let fx=0;
  if(got){
    for(const u of [
      'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',
      'https://open.er-api.com/v6/latest/USD']){
      try{
        const r=await fetchT(u,{},3500);
        const j=await r.json();
        fx=(j.usd&&j.usd.cny)?+j.usd.cny:(j.rates&&j.rates.CNY?+j.rates.CNY:0);
        if(fx>0)break;
      }catch(e){}
    }
    if(!fx&&+GOLD._fx>0)fx=+GOLD._fx;
    if(!fx)fx=7.1;
    GOLD.fx=fx.toFixed(3);GOLD._fx=fx;
    const perG=+GOLD.usd/31.1035*fx;      // 国际金价折合元/克
    GOLD.cny=(perG*1.006).toFixed(2);     // 加国内溢价
    GOLD.cnyChg=GOLD.usdChg||'0.00';
    if(GOLD.silver&&+GOLD.silver>0)GOLD.silverCny=((+GOLD.silver)/31.1035*fx).toFixed(2);
  }
  /* ③ 备用源：gold-api.com（若主源失败） */
  if(!got){
    try{
      const r=await fetchT('https://api.gold-api.com/price/XAU',{},4000);
      const j=await r.json();
      if(j&&+j.price>0){
        GOLD.usd=(+j.price).toFixed(2);
        let f=0;
        try{const fr=await fetchT('https://open.er-api.com/v6/latest/USD',{},3500);
          const fj=await fr.json();f=fj.rates&&fj.rates.CNY?+fj.rates.CNY:0;}catch(e){}
        if(!f)f=+GOLD._fx||7.1;
        GOLD.fx=f.toFixed(3);GOLD._fx=f;
        GOLD.cny=((+j.price)/31.1035*f*1.006).toFixed(2);
        GOLD.time='实时';got=true;GOLD.src='gold-api';
      }
    }catch(e){GOLD.err=(GOLD.err?GOLD.err+'；':'')+'备用源'+e.message;}
  }

  if(got){
    GOLD.ok=true;
    GOLD.date=new Date().toLocaleString('zh-CN',{hour12:false});
    GOLD._ts=Date.now();
    saveGoldCache();
  }
  GOLD.updating=false;
  if(current==='gold'||current==='home')render();
  return got;
}
/* 缓存有效期：10 分钟内可离线展示 */
function goldFresh(){return GOLD.ok&&GOLD._ts&&(Date.now()-GOLD._ts)<10*60*1000;}
/* 兜底：无网络时用日期种子展示参考值 */
function goldToday(){
  const fresh=goldFresh();
  if(GOLD.ok)return{
    cny:GOLD.cny,usd:GOLD.usd,silver:GOLD.silverCny||'--',chg:GOLD.cnyChg||'0.00',
    date:GOLD.date||today(),live:fresh,time:GOLD.time||'',stale:GOLD.ok&&!fresh,
  };
  const s=daySeed();
  return{cny:(612.5+((s*7)%11-5)*0.9).toFixed(2),usd:'--',silver:'--',chg:'0.00',
    date:today(),live:false};
}

/* 本周（周一起）日期数组 */
function getWeekDays(){
  const now=new Date();const dow=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-dow);
  const arr=[];for(let k=0;k<7;k++){const d3=new Date(mon);d3.setDate(mon.getDate()+k);
    arr.push(d3.getFullYear()+'-'+String(d3.getMonth()+1).padStart(2,'0')+'-'+String(d3.getDate()).padStart(2,'0'));}
  return arr;
}

function goalList(){
  const t=today();

  const svGoal=+DB.save.goal||0;
  const svName=DB.save.goalName||'存钱目标';
  const svDate=DB.save.goalDate||'';
  const svDays=svDate?Math.ceil((new Date(svDate)-new Date())/86400000):null;
  out.push({

    detail:svGoal>0?`已存 ¥${fmtN(total)} / 目标 ¥${fmtN(svGoal)}，还差 ¥${fmtN(Math.max(0,svGoal-total))}`:'还没有设定存钱目标',
    extra:svDate?`🗓️ ${svDate} 前完成${svDays!==null?(svDays<0?'（已过期）':`（还剩 ${svDays} 天）`):''}`:'',
  });
  // 2. 赚钱目标
  const emGoal=+DB.money.goal||0;
  let emTotal=0;Object.values(DB.money).forEach(v=>{if(Array.isArray(v))v.forEach(x=>emTotal+=+x.got||0);});
  out.push({
    icon:'💸',name:'每日赚钱目标',
    pct:emGoal>0?Math.min(100,Math.round(emTotal/emGoal*100)):0,
    detail:emGoal>0?`累计到手 ¥${fmtN(emTotal)} / 日目标 ¥${fmtN(emGoal)}`:'还没有设定赚钱目标',
    extra:(DB.money[t]||[]).length?`今日已录 ${(DB.money[t]||[]).length} 个平台`:'今日还没录入',
  });
  // 3. 学习目标（每日目标）
  let stTotal=0,stDays=0;Object.values(DB.study).forEach(l=>{if(Array.isArray(l))l.forEach(x=>stTotal+=+x.min||0);});
  Object.keys(DB.study).forEach(k=>{if((DB.study[k]||[]).length)stDays++;});
  const stDaily=+DB.study.dayGoal||0;
  const stToday=(DB.study[t]||[]).reduce((a,b)=>a+(+b.min||0),0);
  out.push({
    icon:'📚',name:'每日学习目标',
    pct:stDaily>0?Math.min(100,Math.round(stToday/stDaily*100)):0,
    detail:stDaily>0?`今日 ${stToday} 分钟 / 目标 ${stDaily} 分钟`:'还没有设定每日学习目标',
    extra:`累计 ${(stTotal/60).toFixed(1)} 小时 · ${stDays} 天有记录${DB.study.weekGoal?' · 本周目标 '+DB.study.weekGoal+' 天':''}`,
  });
  // 4. 运动目标（每日目标）
  let spTotal=0,spDays=0;Object.values(DB.sports).forEach(l=>{if(Array.isArray(l))l.forEach(x=>spTotal+=+x.min||0);});
  Object.keys(DB.sports).forEach(k=>{if((DB.sports[k]||[]).length)spDays++;});
  const spDaily=+DB.sports.dayGoal||0;
  const spToday=(DB.sports[t]||[]).reduce((a,b)=>a+(+b.min||0),0);
  out.push({
    icon:'🏃',name:'每日运动目标',
    pct:spDaily>0?Math.min(100,Math.round(spToday/spDaily*100)):0,
    detail:spDaily>0?`今日 ${spToday} 分钟 / 目标 ${spDaily} 分钟`:'还没有设定每日运动目标',
    extra:`累计 ${(spTotal/60).toFixed(1)} 小时 · ${spDays} 天有记录${DB.sports.weekGoal?' · 本周目标 '+DB.sports.weekGoal+' 天':''}`,
  });
  // 5. 今日计划完成目标（优先用固定条数）
  const pl=DB.plans[t]||[];const pd=pl.filter(p=>p.done).length;
  const slot=(DB.plans.slot===0)?0:(+DB.plans.slot||6);
  const base=slot>0?slot:pl.length;
  out.push({
    icon:'📋',name:slot>0?`每日计划 ${slot} 条`:'今日计划全部完成',
    pct:base?Math.min(100,Math.round(pd/base*100)):0,

    extra:base&&pd>=base?'🎉 今日计划全部完成啦':(base?`还差 ${base-pd} 条 🪷`:''),
  });
  return out;
}

/* 生成 CSV 文本 */
function buildCsv(range){
  const t=today();const ym=t.slice(0,7);
  const rows=[['日期','类型','分类','金额','备注']];
  Object.keys(DB.finance).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().forEach(d=>{
    if(range==='today'&&d!==t)return;
    if(range==='month'&&d.slice(0,7)!==ym)return;
    const r=DB.finance[d];if(!r||!Array.isArray(r.list))return;
    r.list.forEach(f=>{
      rows.push([d,f.kind==='in'?'收入':'支出',f.type||'其他',(+f.amount||0).toFixed(2),(f.note||'').replace(/[",\n]/g,' ')]);
    });
  });
  return rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
}
function downloadCsv(range){
  const csv='\ufeff'+buildCsv(range);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const name='云琪记账_'+(range==='today'?today():range==='month'?today().slice(0,7):'全部')+'.csv';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
  toast('CSV 已导出：'+name);
}

/* ---- 存钱 ---- */
function renderSave(){
  const t=today();const list=DB.save[t]||[];
  const saved=list.reduce((a,b)=>a+(+b.amount||0),0);
  let total=0;Object.values(DB.save).forEach(v=>{if(Array.isArray(v))v.forEach(x=>total+=+x.amount||0);});
  const goal=DB.save.goal||0;
  const goalName=DB.save.goalName||'我的存钱目标';
  const goalDate=DB.save.goalDate||'';
  const debts=DB.save.debts||[];
  const remain=debts.reduce((a,b)=>a+(+b.amount||0)-(+b.repaid||0),0);
  const pct=goal>0?Math.min(100,Math.round(total/goal*100)):0;
  const diff=goal>0?Math.max(0,goal-total):0;
  // 进度环
  const R=34,C=2*Math.PI*R,off=C-(pct/100)*C;
  const daysLeft=goalDate?Math.ceil((new Date(goalDate)-new Date())/86400000):null;
  return `${moduleHeader(MODULES[9])}
  <div class="card"><h2>📊 数据</h2><div class="stats">
    ${statsCard('今日存入','¥'+fmtN(saved))}${statsCard('累计存款','¥'+fmtN(total))}
    ${statsCard('剩余待还','¥'+fmtN(remain))}${statsCard('距目标还差','¥'+fmtN(diff))}
  </div></div>
  <div class="card"><h2>🎯 存钱目标进度</h2>
    <div class="goal-card"><div class="ring">
      <svg width="86" height="86" viewBox="0 0 86 86">
        <circle cx="43" cy="43" r="${R}" fill="none" stroke="#ffe8ef" stroke-width="9"/>
        <circle cx="43" cy="43" r="${R}" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 43 43)"/>
        <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f9a8c2"/><stop offset="55%" stop-color="#ffb884"/><stop offset="100%" stop-color="#ffd166"/></linearGradient></defs>
        <text x="43" y="48" text-anchor="middle" font-size="17" font-weight="800" fill="#e8628c">${pct}%</text>
      </svg>
      <div style="flex:1;">
        <div class="g-top">${esc(goalName)}</div>
        <div class="g-sub">已存 ¥${fmtN(total)} / 目标 ¥${fmtN(goal||0)}</div>
        <div class="g-sub">${goal?`还差 <b style="color:#f06a8a;">¥${fmtN(diff)}</b>`:'还没设置目标哦'}</div>
        ${goalDate?`<div class="g-sub">🗓️ 目标日 ${goalDate}${daysLeft!==null?`（还剩 ${daysLeft} 天）`:''}</div>`:''}
      </div>
    </div></div>
    <div class="form"><input id="svGoalName" placeholder="目标名称，如：旅行基金" value="${esc(goalName==='我的存钱目标'?'':goalName)}"><input id="svGoalDate" type="date" value="${goalDate}" style="flex:0 0 130px;"></div>
    <div class="form"><input id="svGoal" type="number" placeholder="长期存钱目标 ¥" value="${goal||''}"><button class="btn-main" data-a="setGoal">设目标</button></div>
    <div class="form"><input id="svDayGoal" type="number" placeholder="每日存钱小目标 ¥" value="${DB.save.dayGoal||''}"><button class="btn-main" data-a="setDayGoal" style="flex:0 0 110px;">设日目标</button></div>
  </div>
  <div class="card"><h2>🪙 今日存入</h2><div class="list">
    ${list.length?list.map((s,i)=>`<div class="row"><span class="tag">${esc(s.from||'未指定')}</span>
      <div class="grow"><div class="t-main">¥${s.amount}</div><div class="t-sub">存入来源：${esc(s.from||'未指定')}${s.note?' · '+esc(s.note):''}</div></div>
      <div class="ops"><button class="icon-btn del" data-a="delSave" data-i="${i}">✕</button></div></div>`).join(''):'<div class="empty">今天存一笔，积少成多 🌱</div>'}
  </div>
  <div class="form"><input id="svAmt" type="number" placeholder="存入金额 ¥" style="flex:0 0 110px;">
    <select id="svFrom" style="flex:1;"><option>微信零钱</option><option>支付宝</option><option>银行卡</option><option>现金</option><option>工资卡</option><option>其他</option></select>
    <button class="btn-main" data-a="addSave">存入</button></div>
  <div class="form"><input id="svNote" placeholder="备注（可选）"></div></div>
  <div class="card"><h2>💳 还钱管理 <span style="font-size:10px;color:#c9a6b1;font-weight:400;margin-left:auto;">共 ${debts.length} 笔</span></h2>
  <div class="list">
    ${debts.length?debts.map((s,i)=>{
      const left=(+s.amount||0)-(+s.repaid||0);const dp=+s.amount>0?Math.round((+s.repaid||0)/+s.amount*100):0;
      const dl=s.due?Math.ceil((new Date(s.due)-new Date())/86400000):null;
      return `<div class="row" style="display:block;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="grow"><div class="t-main">${esc(s.name)}</div>
          <div class="t-sub">欠 <b style="color:#e87878;">¥${s.amount}</b> · 已还 ¥${s.repaid||0} · 剩 ¥${left}</div></div>
          <div class="ops"><button class="icon-btn done-btn" data-a="repay" data-i="${i}">还</button><button class="icon-btn del" data-a="delDebt" data-i="${i}">✕</button></div>
        </div>
        <div class="progress" style="height:6px;margin-top:6px;"><div style="width:${dp}%"></div></div>
        <div class="t-sub" style="margin-top:4px;">已还 ${dp}%${s.due?` · 还款日 ${s.due}${dl!==null?(dl<0?'（已逾期）':`（还剩 ${dl} 天）`):''}`:' · 未设还款日'}</div>
        ${s.records&&s.records.length?`<div class="detail">${s.records.map(r=>`· ${r.date} 还 ¥${r.amt}`).join('<br>')}</div>`:''}
      </div>`;}).join(''):'<div class="empty">暂无欠款记录</div>'}
  </div>
  <div class="form"><input id="dbName" placeholder="还给谁/什么钱" style="flex:1 1 100%;"><input id="dbAmt" type="number" placeholder="欠款金额 ¥"></div>
  <div class="form"><input id="dbDue" type="date" style="flex:1;"><button class="btn-main" data-a="addDebt">记欠款</button></div></div>`;
}

function phrasePool(){
  if(!DB.phrases||!DB.phrases.length)DB.phrases=[...PHRASE_SEED];
  return DB.phrases;
}
/* 今日推荐：按日期种子抽 6 条 + 支持"换一批"；在线话术优先混入 */
function renderTalk(){
  const pool=phrasePool();
  const kw=(renderTalk._kw||'').toLowerCase().trim();
  const cats=['全部','职场','生活','人情往来','拒绝话术','高情商回复'];
  const cur=renderTalk._cat||'全部';
  const list=pool.filter(p=>(cur==='全部'||p.cat===cur)&&(!kw||(p.q||'').toLowerCase().includes(kw)||(p.a||'').toLowerCase().includes(kw)));

  // 6 条今日推荐：先按日期+批次洗牌，再交叉分类取 6 条
  const batch=DB.talkBatch||0;
  const seed=(daySeed()%9973)+batch*131;
  const shuffled=pool.map((p,idx)=>({p,k:((idx*2654435761+seed)>>>0)%100003})).sort((a,b)=>a.k-b.k).map(x=>x.p);
  const seen=new Set();const picks=[];
  // 第一轮：每个分类最多取 2 条，保证多样性
  const perCat={};
  for(const p of shuffled){
    if(picks.length>=6)break;
    const c=p.cat||'其他';perCat[c]=perCat[c]||0;
    if(perCat[c]>=2)continue;
    perCat[c]++; picks.push(p);
  }
  // 不够 6 条再补
  for(const p of shuffled){ if(picks.length>=6)break; if(!picks.includes(p))picks.push(p); }

  const online=DB.talkOnline||null;
  const netStatus=renderTalk._netFetching?'获取中…':(online?(online.at?('已更新 '+online.at):'已更新'):'本地精选');

  return `${moduleHeader(MODULES[10])}
  <div class="card"><h2>🌟 今日推荐话术 <span style="font-size:10px;color:#c9a6b1;font-weight:400;margin-left:auto;">${netStatus}</span></h2>
  <div class="list">
  ${picks.map(p=>`<div class="info-item" style="background:linear-gradient(150deg,#fff7fa,#fdeef3);border:1px solid rgba(248,200,212,.7);">
    <div><span class="tag">${esc(p.cat||'精选')}</span><span class="i-title">${esc(p.q)}</span></div>
    <div class="i-desc">${esc(p.a)}</div>
    <div class="ops" style="margin-top:6px;gap:6px;">
      <button class="mini-btn" data-a="copyPh" data-q="${esc(p.q).replace(/"/g,'&quot;')}" data-t="${esc(p.a).replace(/"/g,'&quot;')}">📋 复制</button>
      <button class="mini-btn" data-a="savePh" data-q="${esc(p.q).replace(/"/g,'&quot;')}" data-c="${esc(p.cat||'高情商回复')}" data-t="${esc(p.a).replace(/"/g,'&quot;')}">⭐ 收藏</button>
    </div></div>`).join('')}
  </div>
  <div class="add-row" style="display:flex;gap:8px;">
    <button class="add-btn" data-a="talkShuffle" style="flex:1;">🔄 换一批</button>
    <button class="add-btn" data-a="talkOnline" style="flex:1;">🌐 联网刷新</button>
  </div>
  <div class="hint">共 ${pool.length} 条精选，每天自动换一组 6 条。点「🌐 联网刷新」会尝试从公开话术源拉取新内容合并进来；拉不到时自动用本地精选兜底，不影响使用。</div></div>

  <div class="card"><h2>💬 话术素材库 <span style="font-size:11px;color:#c9a6b1;font-weight:400;margin-left:auto;">共 ${pool.length} 条</span></h2>
  <input class="search-input" id="talkSearch" placeholder="🔍 搜索话术、场景关键词…" value="${esc(renderTalk._kw||'')}">
  <div class="pill-row">${cats.map(c=>{const n=c==='全部'?pool.length:pool.filter(p=>p.cat===c).length;
    return `<div class="pill ${cur===c?'active':''}" data-cat="${c}">${c} ${n}</div>`;}).join('')}</div>
  <div class="list">
    ${list.length?list.map(p=>{
      const gi=pool.indexOf(p);
      return `<div class="info-item" ${p.online?'style="border-color:rgba(143,169,222,.5);"':''}>
      <div><span class="tag">${esc(p.cat)}</span>${p.online?'<span class="tag" style="background:#eaf0fb;color:#8a7ad2;">🌐 在线</span>':''}${p.mine?'<span class="tag" style="background:#f0fbf4;color:#4caf7d;">我加的</span>':''}<span class="i-title">${esc(p.q)}</span></div>
      <div class="i-desc">${esc(p.a)}</div>
      <div class="ops" style="margin-top:6px;gap:6px;">
        <button class="mini-btn" data-a="talkCopy" data-i="${gi}">📋 复制</button>
        <button class="mini-btn" data-a="talkEdit" data-i="${gi}">✏️ 改</button>
        <button class="mini-btn" data-a="talkDel" data-i="${gi}" style="color:#e87878;border-color:#f8d0d0;">✕ 删</button>
      </div></div>`;}).join(''):'<div class="empty">没有匹配的话术，换个词试试 🪷</div>'}
  </div>
  <div class="hint">共 ${list.length} 条匹配结果 · 数量不限，可自由增加与删减</div>
  </div>

  <div class="card"><h2>➕ 增加话术</h2>

  <div class="form"><button class="btn-main" data-a="addPh" style="flex:1;">＋ 加入我的话术库</button></div>
  <div class="hint">新增的话术会标记「我加的」，随时可以删改。</div></div>`;
}

/* 复制文本（含 iOS 兜底） */
function copyText(txt,okMsg){
  const done=()=>toast(okMsg||'已复制 📋');
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  }else fallback();
  function fallback(){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('复制失败，请长按选择');}
    ta.remove();
  }
}

/* 联网刷新话术：尝试公开 CORS 接口，失败则本地精选扩充 */
async function talkOnlineFetch(){
  renderTalk._netFetching=true;render();
  const sources=[
    // 公开语录/一言类接口，支持 CORS，作为"在线内容"来源
    {url:'https://v1.hitokoto.cn/?c=k&encode=json',pick:j=>j.hitokoto?{q:'今日一句 · 人情世故',a:j.hitokoto}:null},
    {url:'https://api.quotable.io/random?tags=communication|wisdom&maxLength=120',pick:j=>j.content?{q:'沟通智慧 · '+(j.author||'名言'),a:j.content}:null},
  ];
  let got=[];
  for(const src of sources){
    try{
      const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),5000);
      const r=await fetch(src.url,{signal:ctl.signal,cache:'no-store'});
      clearTimeout(tm);
      if(!r.ok)continue;
      const j=await r.json();
      const item=src.pick(j);
      if(item&&item.a)got.push({...item,cat:'高情商回复',online:true});
    }catch(e){/* 忽略单个源失败 */}
  }
  renderTalk._netFetching=false;
  if(!got.length){render();toast('网络源暂不可用，已使用本地精选');return false;}
  DB.talkOnline={at:new Date().toLocaleString('zh-CN',{hour12:false}).slice(5,16),items:got.length};
  DB.talkBatch=(DB.talkBatch||0)+1;
  // 合并去重
  got.forEach(g=>{
    if(!DB.phrases.some(p=>p.a===g.a))DB.phrases.unshift(g);
  });
  save();render();
  toast('已联网更新 '+got.length+' 条话术 🌐');
  return true;
}

/* ---- 黄金财经 ---- */

  const g=goldToday();
  const up=parseFloat(g.chg)>=0;
  const live=g.live;

  return `${moduleHeader(MODULES[11])}
  <div class="card"><h2>📈 实时金价 <span style="font-size:10px;color:#c9a6b1;font-weight:400;margin-left:auto;">${live?'🔴 实时':'⚪ 参考'} ${upd}</span></h2>
  <div class="stats">
    ${statsCard('国内金价','¥'+g.cny,'/克')}
    ${statsCard('伦敦金','$'+g.usd,'/盎司')}
    ${statsCard('今日涨跌',(up?'▲':'▼')+Math.abs(g.chg)+'%')}
    ${statsCard('白银','¥'+(g.silver==='--'?'--':g.silver),'/克')}
  </div>
  <div class="form" style="margin-top:8px;"><button class="btn-main" data-a="refreshGold" style="flex:1;">🔄 刷新行情${GOLD.updating?' 获取中…':''}</button></div>
  <div class="hint" style="text-align:center;">${live?`数据来源：${GOLD.src||'行情源'} · 汇率 ${GOLD.fx||'--'} · 行情时间 ${g.time||'--'}`:(g.stale?`⚠️ 当前为 ${GOLD.date} 的缓存数据，点击刷新获取最新`:('⚠️ 暂未获取到实时行情'+(GOLD.err?'（'+GOLD.err+'）':'')+'，点击上方按钮重试'))}</div></div>
  <div class="card"><h2>📰 财经简要资讯</h2>

/* ================= 事件处理 ================= */
function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

document.getElementById('main').addEventListener('click',e=>{
  const nc=e.target.closest('.nav-card');
  if(nc){current=nc.dataset.id;render();return;}
  const btn=e.target.closest('[data-a]');
  if(btn){handleAction(btn);return;}
});

function handleAction(btn){
  const a=btn.dataset.a,i=+btn.dataset.i,t=today();
  const g=id=>document.getElementById(id);
  switch(current+'/'+a){
    case 'home/x': break;
    case 'money/finTab':renderFinance._tab=btn.dataset.v;renderFinance._cat=btn.dataset.v==='in'?'工资':'餐饮';render();break;
    case 'money/finCat':renderFinance._cat=btn.dataset.v;render();break;
    case 'money/setBudget':{const v=+g('finBudget').value;if(!v)return toast('填一下本月预算');
      DB.finance.budget=v;renderFinance._budget=undefined;save();render();toast('本月预算已设定 🎯');break;}
    case 'money/finExp':renderFinance._exp=btn.dataset.v;render();break;
    case 'money/expCsv':downloadCsv(renderFinance._exp||'month');break;
    case 'money/expShare':{
      const range=renderFinance._exp||'month';
      const csv='\ufeff'+buildCsv(range);
      const name='云琪记账_'+(range==='today'?today():range==='month'?today().slice(0,7):'全部')+'.csv';
      const file=new File([csv],name,{type:'text/csv'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'云琪记账账单',text:'记账 CSV，可在鲨鱼记账中导入'})
          .then(()=>toast('已发送 📮')).catch(()=>downloadCsv(range));
      }else{downloadCsv(range);toast('此环境不支持分享，已下载 CSV');}
      break;}
    case 'home/homeTab':renderHome._tab=btn.dataset.v;render();break;
    case 'home/goModule':current=btn.dataset.v;render();break;
    case 'plan/toggle':{const it=DB.plans[t][i];it.done=!it.done;it.doneAt=it.done?new Date().toLocaleString('zh-CN',{hour12:false}):'';save();render();break;}
    case 'plan/setPlanSlot':{
      const v=Math.max(0,Math.min(30,parseInt(g('plSlot').value)||0));
      DB.plans.slot=v;save();render();
      toast(v>0?`已设置每天固定 ${v} 条 🪷`:'已取消固定条数');break;}
    case 'plan/planFill':DB.plans.fill=btn.dataset.v==='1';save();render();break;
    case 'plan/fillSlot':{
      const v=prompt(`填写第 ${i+1} 条计划`);
      if(v===null)return;
      const vv=(v||'').trim();if(!vv)return toast('还没写内容哦');
      DB.plans[t]=DB.plans[t]||[];
      // 补到 i 位置（中间若有空缺用占位）
      while(DB.plans[t].length<i)DB.plans[t].push({t:'（未填写）',done:false,blank:true,at:new Date().toLocaleString('zh-CN',{hour12:false})});
      if(DB.plans[t][i]&&DB.plans[t][i].blank){DB.plans[t][i]={t:vv,done:false,pri:false,at:new Date().toLocaleString('zh-CN',{hour12:false})};}
      else DB.plans[t].push({t:vv,done:false,pri:false,at:new Date().toLocaleString('zh-CN',{hour12:false})});
      save();render();toast('已补上 🌷');break;}
    case 'plan/expand':{const arr=renderPlan._open||[];const k=arr.indexOf(i);if(k>=0)arr.splice(k,1);else arr.push(i);renderPlan._open=arr;render();break;}
    case 'plan/planRange':renderPlan._range=btn.dataset.v;renderPlan._hd=null;render();break;
    case 'plan/planHist':renderPlan._hd=renderPlan._hd===btn.dataset.d?null:btn.dataset.d;render();break;
    case 'plan/pri':DB.plans[t][i].pri=!DB.plans[t][i].pri;save();render();break;
    case 'plan/del':DB.plans[t].splice(i,1);save();render();break;
    case 'plan/add':{const v=g('planIn').value.trim();if(!v)return toast('先写点什么吧 🌷');
      const noteEl=g('planNote');const note=noteEl?noteEl.value.trim():'';
      DB.plans[t]=DB.plans[t]||[];
      DB.plans[t].push({t:v,done:false,pri:g('planPri').value==='1',note,at:new Date().toLocaleString('zh-CN',{hour12:false})});
      save();render();break;}
    case 'sport/setSpGoal':{
      const d1=+g('spDaily').value,cg=+g('spCalGoal').value;
      if(!d1)return toast('填一下每日运动分钟目标');
      DB.sports.dayGoal=d1;DB.sports.calGoal=cg||0;
      save();render();toast('运动目标已设定 🎯');break;}
    case 'sport/setSpWeek':{const v=+g('spWeekGoal').value;if(!v)return toast('填一下每周天数目标');
      DB.sports.weekGoal=v;save();render();toast('周目标已设定 🎯');break;}
    case 'sport/del':DB.sports[t].splice(i,1);save();render();break;
    case 'sport/add':{const n=g('spName').value.trim();const m=+g('spMin').value,c=+g('spCal').value;if(!n||!m)return toast('填写项目和时长哦');DB.sports[t]=DB.sports[t]||[];DB.sports[t].push({name:n,min:m,cal:c||0});save();render();break;}
    case 'money/addSpend':{
      const amt=+g('finAmt').value;
      if(!amt)return toast('填一下金额呀');
      const isIn=(renderFinance._tab||'out')==='in';
      const cat=renderFinance._cat||(isIn?'工资':'餐饮');
      const noteEl=g('finNote');const note=noteEl?noteEl.value.trim():'';
      const dateEl=g('finDate');const dd=dateEl&&dateEl.value?dateEl.value:t;
      DB.finance[dd]=DB.finance[dd]||{list:[],save:0};
      DB.finance[dd].list=DB.finance[dd].list||[];
      DB.finance[dd].list.push({amount:amt,type:cat,note,kind:isIn?'in':'out',
        at:new Date().toLocaleTimeString('zh-CN',{hour12:false}).slice(0,5)});
      renderFinance._amt='';renderFinance._note='';
      save();render();toast((isIn?'收入':'支出')+'已记账 '+catIcon(cat,isIn)+' ¥'+amt);break;}
    case 'money/addSave':{const amt=+g('finSave').value;if(!amt)return toast('填一下金额呀');DB.finance[t]=DB.finance[t]||{list:[],save:0};DB.finance[t].save=(+DB.finance[t].save||0)+amt;save();render();break;}
    case 'money/delSpend':{DB.finance[t].list.splice(i,1);save();render();break;}
    case 'study/setStGoal':{
      const d1=+g('stDaily').value;
      if(!d1)return toast('填一下每日学习分钟目标');
      DB.study.dayGoal=d1;
      const nm=g('stName');if(nm&&nm.value.trim())DB.study.goalName=nm.value.trim();
      save();render();toast('学习目标已设定 🎯');break;}
    case 'study/setStWeek':{const v=+g('stWeekGoal').value;if(!v)return toast('填一下每周天数目标');
      DB.study.weekGoal=v;save();render();toast('周目标已设定 🎯');break;}
    case 'study/del':DB.study[t].splice(i,1);save();render();break;
    case 'study/add':{const v=g('stTask').value.trim();const m=+g('stMin').value;if(!v||!m)return toast('填内容和时长哦');DB.study[t]=DB.study[t]||[];DB.study[t].push({cat:g('stCat').value,task:v,min:m});
      DB.study.book=g('stCat').value;save();render();toast('学完啦，你真棒 🪷');break;}
    case 'earn/del':DB.money[t].splice(i,1);save();render();break;
    case 'earn/check':DB.money[t][i].got=DB.money[t][i].got||0;DB.money[t][i].done=!DB.money[t][i].done;save();render();toast('打卡成功 💪');break;
    case 'earn/add':{const app=g('emApp').value.trim();const got=+g('emGot').value||0;if(!app)return toast('填写软件名称哦');DB.money[t]=DB.money[t]||[];DB.money[t].push({app,got});save();render();break;}
    case 'earn/setGoal':{const v=+g('emGoal').value;if(!v)return toast('填一下目标金额');DB.money.goal=v;save();render();break;}
    case 'save/delSave':DB.save[t].splice(i,1);save();render();break;
    case 'save/addSave':{const v=+g('svAmt').value;if(!v)return toast('填一下金额呀');
      const fromEl=g('svFrom');const noteEl=g('svNote');
      DB.save[t]=DB.save[t]||[];
      DB.save[t].push({amount:v,from:fromEl?fromEl.value:'其他',note:noteEl?noteEl.value.trim():''});
      save();render();break;}
    case 'save/setGoal':{const v=+g('svGoal').value;if(!v)return toast('填一下目标金额');
      DB.save.goal=v;
      const nm=g('svGoalName'),dt=g('svGoalDate');
      if(nm&&nm.value.trim())DB.save.goalName=nm.value.trim();
      if(dt&&dt.value)DB.save.goalDate=dt.value;
      save();render();toast('目标已设定 🎯');break;}
    case 'save/setDayGoal':{const v=+g('svDayGoal').value;if(!v)return toast('填一下每日目标金额');
      DB.save.dayGoal=v;save();render();toast('每日小目标已设定 🌱');break;}
    case 'save/addDebt':{const n=g('dbName').value.trim();const amt=+g('dbAmt').value;if(!n||!amt)return toast('填名称和金额哦');
      const dueEl=g('dbDue');
      DB.save.debts=DB.save.debts||[];
      DB.save.debts.push({name:n,amount:amt,repaid:0,due:dueEl?dueEl.value:'',records:[]});
      save();render();break;}
    case 'save/repay':{const d2=DB.save.debts[i];const remain=(+d2.amount||0)-(+d2.repaid||0);
      const v=prompt(`「${d2.name}」本次还款金额（剩余 ¥${remain}）`,remain);if(v===null)break;
      const r=Math.max(0,Math.min(+v||0,remain));if(!r)break;
      d2.repaid=(+d2.repaid||0)+r;
      d2.records=d2.records||[];d2.records.push({date:new Date().toLocaleDateString('zh-CN'),amt:r});
      save();render();
      if((+d2.amount||0)-(+d2.repaid||0)<=0)toast('这笔还清啦，太棒了 🎉');break;}
    case 'save/delDebt':DB.save.debts.splice(i,1);save();render();break;
    case 'talk/addPh':{const q=g('phQ')?g('phQ').value.trim():'',ans=g('phA')?g('phA').value.trim():'';
      if(!q||!ans)return toast('场景和内容都要填哦');
      const catEl=g('phCat');const cat=catEl?catEl.value:(renderTalk._cat&&renderTalk._cat!=='全部'?renderTalk._cat:'职场');
      DB.phrases.unshift({cat,q,a:ans,mine:true,at:new Date().toLocaleDateString('zh-CN')});
      renderTalk._addQ='';renderTalk._addA='';
      save();render();toast('已加入话术库 🪷');break;}
    case 'talk/talkShuffle':DB.talkBatch=(DB.talkBatch||0)+1;save();render();break;
    case 'talk/talkOnline':talkOnlineFetch();break;
    case 'talk/copyPh':copyText(btn.dataset.t||'', '话术已复制 📋');break;
    case 'talk/talkCopy':{const ph=DB.phrases[i];if(!ph)break;copyText(ph.a,'话术已复制 📋');break;}
    case 'talk/savePh':{const q=btn.dataset.q,a2=btn.dataset.t,c2=btn.dataset.c||'高情商回复';
      if(!a2)break;
      if(DB.phrases.some(p=>p.a===a2))return toast('这条已经在库里啦');
      DB.phrases.unshift({cat:c2,q,a:a2,mine:true});save();render();toast('已收藏进话术库 ⭐');break;}
    case 'talk/talkEdit':{const ph=DB.phrases[i];if(!ph)break;
      const nv=prompt('修改话术内容（取消则不变）',ph.a);
      if(nv===null)break;if(!nv.trim())return toast('内容不能为空');
      const nq=prompt('场景描述（可改，取消保持不变）',ph.q);
      ph.a=nv.trim();if(nq!==null&&nq.trim())ph.q=nq.trim();
      save();render();toast('已更新 ✏️');break;}
    case 'talk/talkDel':{const ph=DB.phrases[i];if(!ph)break;
      if(!confirm('确定删除这条话术？\n\n'+(ph.q||'')))break;
      DB.phrases.splice(i,1);save();render();toast('已删除');break;}
    case 'talk/delPh':DB.phrases.splice(i,1);save();render();break;
    case 'sync/saveCfg':{SYNC_CFG={url:g('cfgUrl').value.trim(),key:g('cfgKey').value.trim(),uid:g('cfgUid').value.trim()||'yunqi'};localStorage.setItem(SYNC_CFG_KEY,JSON.stringify(SYNC_CFG));logSync('⚙️ 已保存同步配置');render();toast('配置已保存');break;}
    case 'sync/pushNow':pushCloud();break;
    case 'sync/pullNow':pullCloud();break;
    case 'sync/clearLog':SYNC_LOG=[];localStorage.setItem('yunqi_sync_log','[]');render();break;
    case 'gold/refreshGold':toast('正在获取实时行情…');fetchGold().then(ok=>{if(!ok)toast('获取失败，请检查网络');});break;
    case 'pod/shuffle':SHUFFLE.pod++;render();break;
    case 'hot/shuffle':SHUFFLE.hot++;render();break;
    case 'ai/shuffle':SHUFFLE.ai++;render();break;
  }
}

/* 其他交互：打卡按钮 / 搜索 / 分类 */
document.addEventListener('click',e=>{
  const j=e.target.closest('.jump');
  if(j){e.preventDefault();doJump(j.dataset.p,j.dataset.k);return;}
  const seg=e.target.closest('.seg-i');
  if(seg){renderHome._tab=seg.dataset.v;render();return;}
  const chip=e.target.closest('.chip[data-a]');
  if(chip){handleAction(chip);return;}
  if(e.target.id==='checkinBtn'){
    const t=today();
    if(DB.checkin[t]){delete DB.checkin[t];toast('已撤回今日打卡');}
    else{DB.checkin[t]=true;toast('打卡成功，今天也超棒 🪷');}
    save();render();
  }
  const pill=e.target.closest('.pill');
  if(pill){renderTalk._cat=pill.dataset.cat;render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='finAmt'){renderFinance._amt=e.target.value;return;}
  if(e.target.id==='finNote'){renderFinance._note=e.target.value;return;}
  if(e.target.id==='finDate'){renderFinance._date=e.target.value;return;}
  if(e.target.id==='finBudget'){renderFinance._budget=e.target.value;return;}
  if(e.target.id==='phQ'){renderTalk._addQ=e.target.value;return;}
  if(e.target.id==='phA'){renderTalk._addA=e.target.value;return;}
  if(e.target.id==='talkSearch'){renderTalk._kw=e.target.value;
    const list=document.getElementById('main');
    // 仅重渲染列表区域，避免输入框失焦
    setTimeout(()=>{const kw=renderTalk._kw;const main=document.getElementById('main');
      // 简化：重建整个页面但恢复焦点
      const pos=e.target.selectionStart;render();
      const inp=document.getElementById('talkSearch');if(inp){inp.focus();if(inp.setSelectionRange)inp.setSelectionRange(pos,pos);}},0);
  }
});

/* ================= 主渲染 ================= */
function render(){
  renderNav();
  const m=document.getElementById('main');
  const map={home:renderHome,plan:renderPlan,sport:renderSport,money:renderFinance,pod:renderPod,study:renderStudy,hot:renderHot,ai:renderAI,earn:renderEarn,save:renderSave,talk:renderTalk,gold:renderGold,sync:renderSync};
  m.innerHTML=map[current]();
}

/* 时钟 + 每日零点自动刷新（跨天后自动切换当日模块，历史记录保留） */
let _curDate=today();
setInterval(()=>{
  const c=document.getElementById('clock');
  if(c)c.textContent=new Date().toTimeString().slice(0,8);
  if(today()!==_curDate){
    _curDate=today();
    render();
    toast('🌅 新的一天开始啦，今日模块已自动刷新');
  }
},1000);

/* 启动：渲染 + 开机自动拉取云端 */
render();
if(syncReady()){pullCloud(true);}
/* 实时金价：开机拉取 + 每 60 秒刷新一次 */
fetchGold();
setInterval(()=>{if(navigator.onLine)fetchGold();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchGold();});
