<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f06a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="云琪工作台">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>云琪工作台</title>
<style>
:root{
  --pink:#f8c8d4;      /* 樱花粉 */
  --pink-deep:#e88ca4; /* 浅玫红 */
  --pink-rose:#f06a8a; /* 玫粉色按钮 */
  --pink-bg:#fdf0f4;   /* 页面底色 */
  --white:#ffffff;
  --text:#8a5a68;
  --text-dark:#6b4650;
  --shadow:0 4px 14px rgba(232,140,164,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,sans-serif;
  background:linear-gradient(160deg,#fde8ef 0%,#fdf0f4 45%,#fef7f0 100%);
  color:var(--text);
  min-height:100vh;
  font-size:15px;
}
/* ---------- 布局 ---------- */
#app{display:flex;min-height:100vh;}
/* 侧边竖向导航 */
nav{
  width:56px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(8px);
  border-right:1px solid rgba(248,200,212,.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 0;
  gap:2px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  flex-shrink:0;
  z-index:20;
}
.nav-item{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;border-radius:14px;
  cursor:pointer;transition:.2s;
  position:relative;
}
.nav-item:hover{background:#fdeef3;}
.nav-item.active{background:linear-gradient(135deg,#f9b8c9,#f48fb1);box-shadow:var(--shadow);}
.nav-logo{font-size:24px;margin-bottom:6px;}
main{flex:1;padding:14px 14px 40px;max-width:520px;margin:0 auto;width:100%;}
/* ---------- 顶部 ---------- */
header{text-align:center;padding:6px 0 4px;}
#clock{font-size:34px;font-weight:700;color:var(--text-dark);letter-spacing:2px;font-variant-numeric:tabular-nums;}
#dateStr{font-size:13px;color:#c2899a;margin-top:2px;}
.header-top{position:relative;}
#checkinBtn{
  position:absolute;top:0;right:0;
  background:linear-gradient(135deg,#f06a8a,#e8547b);
  color:#fff;border:none;border-radius:20px;
  padding:8px 14px;font-size:13px;font-weight:600;
  box-shadow:0 4px 12px rgba(240,106,138,.4);
  cursor:pointer;
}
#checkinBtn.done{background:#c9c9c9;box-shadow:none;}
/* 治愈文案 */
.quote{
  margin:12px 0 16px;
  background:var(--white);
  border-radius:18px;
  padding:14px 16px;
  box-shadow:var(--shadow);
  text-align:center;
}
.quote .zh{font-size:14px;color:var(--text-dark);font-weight:600;}
.quote .en{font-size:12px;color:#c2899a;margin-top:4px;font-style:italic;}
/* ---------- 卡片 ---------- */
.card{
  background:var(--white);
  border-radius:20px;
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.card h2{font-size:16px;color:var(--text-dark);display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.page-title{font-size:20px;font-weight:700;color:var(--text-dark);margin:4px 0 12px;display:flex;align-items:center;gap:8px;}
/* 数据卡片 4 宫格 */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.stat{
  background:linear-gradient(150deg,#fff5f8,#fdeef3);
  border:1px solid rgba(248,200,212,.5);
  border-radius:16px;
  padding:12px;
  text-align:center;
}
.stat .label{font-size:11px;color:#c2899a;}
.stat .num{font-size:22px;font-weight:800;color:var(--pink-rose);margin-top:4px;font-variant-numeric:tabular-nums;}
.stat .num small{font-size:11px;font-weight:600;}
/* 列表 */
.list{display:flex;flex-direction:column;gap:8px;}
.row{
  background:#fff8fa;
  border:1px solid rgba(248,200,212,.45);
  border-radius:14px;
  padding:10px 12px;
  display:flex;align-items:center;gap:8px;
  font-size:13px;
  animation:fadeIn .25s;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.row .grow{flex:1;min-width:0;}
.row .t-main{color:var(--text-dark);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .t-sub{font-size:11px;color:#c2899a;margin-top:2px;}
.row .ops{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{
  border:none;background:#fce4ec;color:#e88ca4;
  width:26px;height:26px;border-radius:9px;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn.del{background:#ffe3e3;color:#e87878;}
.icon-btn.done-btn{background:#d9f2e4;color:#4caf7d;}
/* 表单 */
.form{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.form input,.form select,.form textarea{
  border:1.5px solid rgba(248,200,212,.8);
  border-radius:12px;padding:9px 10px;font-size:13px;
  background:#fffafc;color:var(--text-dark);outline:none;
  min-width:0;flex:1;
}
.form input:focus{border-color:var(--pink-deep);}
.form .btn-main{
  background:linear-gradient(135deg,#f9b8c9,#f48fb1);
  color:#fff;border:none;border-radius:12px;padding:9px 16px;
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}
/* 添加按钮 */
.add-row{display:flex;justify-content:center;margin-top:10px;}
.add-btn{
  background:var(--white);border:1.5px dashed var(--pink-deep);
  color:var(--pink-deep);border-radius:14px;padding:9px 22px;
  font-size:13px;font-weight:600;cursor:pointer;
}
.add-btn:active{background:#fdeef3;}
/* 进度条 */
.progress{height:10px;background:#fce4ec;border-radius:6px;overflow:hidden;margin-top:8px;}
.progress>div{height:100%;background:linear-gradient(90deg,#f9b8c9,#f06a8a);border-radius:6px;transition:width .4s;}
.progress-text{font-size:11px;color:#c2899a;margin-top:4px;text-align:center;}
/* 标签 */
.tag{display:inline-block;background:#fdeef3;color:var(--pink-deep);font-size:10px;padding:2px 8px;border-radius:8px;margin-right:6px;}
.tag.src{background:#f0f4ff;color:#7a8ec9;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.pill{
  border:1px solid rgba(248,200,212,.8);background:#fff;
  color:var(--text);border-radius:14px;padding:5px 12px;font-size:12px;cursor:pointer;
}
.pill.active{background:linear-gradient(135deg,#f9b8c9,#f48fb1);color:#fff;border-color:transparent;}
/* 内容条目（资讯类） */
.info-item{
  background:#fff8fa;border-radius:14px;padding:10px 12px;margin-bottom:8px;
  border:1px solid rgba(248,200,212,.45);
}
.info-item .i-title{font-size:13px;font-weight:700;color:var(--text-dark);}
.info-item .i-desc{font-size:12px;color:#a97b8a;margin-top:3px;line-height:1.5;}
.info-item .i-src{font-size:10px;color:#b9a0aa;margin-top:5px;}
.jump-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.jump{background:#fdeef3;color:#e88ca4;font-size:11px;font-weight:600;text-decoration:none;
  border:none;cursor:pointer;font-family:inherit;
  border-radius:10px;padding:4px 10px;display:inline-block;}
.jump:active{background:#f9d7e2;}
.search-input{width:100%;border:1.5px solid rgba(248,200,212,.8);border-radius:12px;padding:9px 12px;font-size:13px;background:#fffafc;outline:none;margin-bottom:10px;}
.empty{text-align:center;color:#d3a8b5;font-size:12px;padding:14px 0;}
.toast{
  position:fixed;left:50%;bottom:60px;transform:translateX(-50%);
  background:rgba(107,70,80,.92);color:#fff;font-size:13px;
  padding:10px 18px;border-radius:16px;z-index:99;
  animation:fadeIn .2s;pointer-events:none;white-space:nowrap;
}
.hint{font-size:11px;color:#c9a6b1;margin-top:8px;line-height:1.6;}
.checked .t-main{text-decoration:line-through;color:#c9a6b1;}
.streak-badge{background:linear-gradient(135deg,#ffd3a5,#ff9a9e);color:#fff;font-size:11px;border-radius:10px;padding:3px 10px;font-weight:600;}
.nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.nav-card{
  background:linear-gradient(150deg,#fff5f8,#fdeef3);
  border:1px solid rgba(248,200,212,.5);
  border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;
  transition:.15s;
}
.nav-card:active{transform:scale(.96);}
.nav-card .e{font-size:24px;}
.nav-card .n{font-size:11px;color:var(--text-dark);margin-top:6px;font-weight:600;}
.nav-card .v{font-size:11px;color:var(--pink-rose);margin-top:3px;font-weight:700;}
@media(min-width:600px){ main{max-width:560px;} }
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
/* ================= 云端同步（Supabase） ================= */
const SYNC_CFG_KEY='yunqi_sync_cfg';
let SYNC_CFG=JSON.parse(localStorage.getItem(SYNC_CFG_KEY)||'null')||{url:'',key:'',uid:'yunqi'};
let SYNC_LOG=JSON.parse(localStorage.getItem('yunqi_sync_log')||'[]');
let pushTimer=null;
function logSync(msg,type='info'){
  SYNC_LOG.unshift({time:new Date().toLocaleString('zh-CN',{hour12:false}),msg,type});
  SYNC_LOG=SYNC_LOG.slice(0,60);
  localStorage.setItem('yunqi_sync_log',JSON.stringify(SYNC_LOG));
}
function syncReady(){return SYNC_CFG.url&&SYNC_CFG.key;}
async function pushCloud(silent){
  if(!syncReady()){if(!silent)toast('请先在 ⚙️ 设置中配置 Supabase');return;}
  try{
    const res=await fetch(SYNC_CFG.url.replace(/\/$/,'')+'/rest/v1/yunqi_data',
      {method:'POST',
       headers:{'apikey':SYNC_CFG.key,'Authorization':'Bearer '+SYNC_CFG.key,
        'Content-Type':'application/json','Prefer':'resolution=merge-deduplicate,return=minimal'},
       body:JSON.stringify([{uid:SYNC_CFG.uid,data:DB,updated_at:new Date().toISOString(),device:navigator.userAgent.slice(0,60)}])});
    if(!res.ok)throw new Error('HTTP '+res.status);
    DB._lastPush=new Date().toISOString();saveLocal();
    logSync('⬆️ 已上传本地数据到云端','ok');if(!silent)toast('已同步到云端 ☁️');
  }catch(e){logSync('⬆️ 上传失败：'+e.message,'err');if(!silent)toast('同步失败：'+e.message);}
}
async function pullCloud(silent){
  if(!syncReady()){if(!silent)toast('请先在 ⚙️ 设置中配置 Supabase');return;}
  try{
    const res=await fetch(SYNC_CFG.url.replace(/\/$/,'')+'/rest/v1/yunqi_data?uid=eq.'+encodeURIComponent(SYNC_CFG.uid)+'&order=updated_at.desc&limit=1',
      {headers:{'apikey':SYNC_CFG.key,'Authorization':'Bearer '+SYNC_CFG.key}});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const rows=await res.json();
    if(rows&&rows.length&&rows[0].data){
      const cloud=rows[0].data, cloudT=rows[0].updated_at, localT=DB._lastPush||'';
      if(cloudT>localT){
        DB=cloud;saveLocal();logSync('⬇️ 从云端拉取数据（云端较新）','ok');render();
        if(!silent)toast('已从云端同步最新数据 ☁️');
      }else{
        logSync('⬇️ 云端无更新（本地已是最新）');if(!silent)toast('本地已是最新 ✨');
      }
    }else{logSync('⬇️ 云端暂无数据，已上传本地','ok');await pushCloud(true);if(!silent)toast('云端为空，已上传本地数据');}
  }catch(e){logSync('⬇️ 拉取失败：'+e.message,'err');if(!silent)toast('同步失败：'+e.message);}
}
function schedulePush(){ // 高频修改防抖：2.5s 合并一次上传
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{if(navigator.onLine&&syncReady())pushCloud(true);else logSync('📴 离线中，数据已本地缓存，联网后自动上传');},2500);
}
window.addEventListener('online',()=>{logSync('🌐 网络已恢复，开始自动同步');pushCloud(true);});
window.addEventListener('beforeunload',()=>{if(syncReady())navigator.sendBeacon&&navigator.sendBeacon(SYNC_CFG.url+'/rest/v1/yunqi_data',null);});

/* ================= 数据存储（自动保存 + 离线缓存） ================= */
const KEY='yunqi_workbench_v1';
let DB=JSON.parse(localStorage.getItem(KEY)||'null')||{
  checkin:{},           // 打卡 {date:true}
  plans:{},             // {date:[{t,done,pri}]}
  sports:{},            // {date:[{name,min,cal}]}
  finance:{},           // {date:[{type,amount,note}],save:amount}
  study:{},             // {date:[{cat,task,min}]}
  money:{},             // {date:[{app,got}], goal}
  save:{},              // {date:[{amount}], goal, target, debts:[{name,amount,repaid}]}
  phrases:[],           // 话术
};
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(DB));}
function save(){ // 自动保存：本地缓存 + 防抖云同步
  saveLocal();schedulePush();
}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtN=n=>{n=Number(n)||0;return n>=10000?(n/10000).toFixed(1)+'w':(Math.round(n*100)/100).toString();};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600);}

/* ================= 模块定义 ================= */
const MODULES=[
 {id:'home',  icon:'🏠',name:'工作台', sub:'云琪工作台总览'},
 {id:'plan',  icon:'📋',name:'每日计划', sub:'当天最重要的待办'},
 {id:'sport', icon:'🏃',name:'每日运动', sub:'运动时长与卡路里'},
 {id:'money', icon:'💰',name:'每日记账', sub:'开支与存钱流水'},
 {id:'pod',   icon:'🎙️',name:'晨间播客', sub:'每日选题清单'},
 {id:'study', icon:'📚',name:'每日学习', sub:'学习时长与鼓励'},
 {id:'hot',   icon:'🔥',name:'热点话题', sub:'每日热点素材'},
 {id:'ai',    icon:'✨',name:'AI 爆品', sub:'AI 工具与变现'},
 {id:'earn',  icon:'💸',name:'赚钱',   sub:'赚钱打卡面板'},
 {id:'save',  icon:'🪙',name:'存钱',   sub:'存款目标与还钱'},
 {id:'talk',  icon:'💬',name:'情商话术', sub:'沟通话术素材库'},
 {id:'gold',  icon:'📈',name:'黄金财经', sub:'金价与财经资讯'},
 {id:'sync',  icon:'⚙️',name:'设置',   sub:'云端同步 · 日志'},
];

/* ---- 设置 / 云同步 ---- */
function renderSync(){
  const st=syncReady();
  return `${moduleHeader(MODULES.find(m=>m.id==='sync'))}
  <div class="card"><h2>☁️ 多端云同步（Supabase）</h2>
  <div class="stats">
    ${statsCard('同步状态',st?'已连接':'未配置')}
    ${statsCard('本地缓存',st?'✅ 开启':'✅ 开启')}
    ${statsCard('自动同步',st?'防抖 2.5s':'等待配置')}
    ${statsCard('上次上传',(DB._lastPush?new Date(DB._lastPush).toLocaleTimeString('zh-CN',{hour12:false}):'--'))}
  </div>
  <div class="hint">📱 手机 / 💻 电脑 / 📟 平板使用同一 UID 即可数据互通：离线时写入本地缓存，联网自动上传下载，历史记录与台账永不删除。</div>
  <div class="form" style="margin-top:10px;"><input id="cfgUrl" placeholder="Supabase 项目 URL（https://xxx.supabase.co）" value="${esc(SYNC_CFG.url)}"></div>
  <div class="form"><input id="cfgKey" placeholder="Supabase anon key（公开密钥）" value="${esc(SYNC_CFG.key)}"></div>
  <div class="form"><input id="cfgUid" placeholder="设备组 UID（同一 UID 的设备互通）" value="${esc(SYNC_CFG.uid)}"><button class="btn-main" data-a="saveCfg">保存配置</button></div>
  <div class="form">
    <button class="btn-main" data-a="pushNow" style="flex:1;">⬆️ 手动上传</button>
    <button class="btn-main" data-a="pullNow" style="flex:1;">⬇️ 手动下载</button>
  </div>
  <div class="hint">💡 Supabase 中需建表：<b>yunqi_data</b>（字段：uid text 主键, data jsonb, updated_at timestamptz, device text），并开启 RLS 后添加「匿名可读写」策略。</div></div>
  <div class="card"><h2>📜 同步日志 <span style="font-size:10px;color:#c9a6b1;font-weight:400;margin-left:auto;">最近 ${SYNC_LOG.length} 条</span></h2>
  <div class="list">
    ${SYNC_LOG.length?SYNC_LOG.map(l=>`<div class="row"><div class="grow"><div class="t-main" style="font-weight:400;">${l.msg}</div><div class="t-sub">${l.time}</div></div></div>`).join(''):'<div class="empty">暂无同步记录</div>'}
  </div>
  <div class="add-row"><button class="add-btn" data-a="clearLog">清空日志</button></div></div>`;
}

/* ================= 跳转其他 App（平台搜索深链） ================= */
const SEARCH_URLS={
 '小红书':k=>'https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(k),
 '抖音':k=>'https://www.douyin.com/search/'+encodeURIComponent(k),
 '微博':k=>'https://s.weibo.com/weibo?q='+encodeURIComponent(k),
 '苹果播客':k=>'https://podcasts.apple.com/cn/search?term='+encodeURIComponent(k),
 'B站':k=>'https://search.bilibili.com/all?keyword='+encodeURIComponent(k),
 '百度':k=>'https://www.baidu.com/s?wd='+encodeURIComponent(k),
 '必应':k=>'https://www.bing.com/search?q='+encodeURIComponent(k),
 '学习强国':k=>'https://www.baidu.com/s?wd='+encodeURIComponent('学习强国 '+k),
 '申材有道':k=>'https://www.baidu.com/s?wd='+encodeURIComponent('申材有道 '+k),
 '播客平台':k=>'https://podcasts.apple.com/cn/search?term='+encodeURIComponent(k),
 '财经综合':k=>'https://www.baidu.com/s?wd='+encodeURIComponent('黄金金价 '+k),
 '网络':k=>'https://www.bing.com/search?q='+encodeURIComponent(k),
};
/* 各平台 App 深链协议（装了 App 直接唤起搜索页） */
const APP_SCHEMES={
 '小红书':k=>'xhsdiscover://search/result?keyword='+encodeURIComponent(k),
 '抖音':k=>'snssdk1128://search?keyword='+encodeURIComponent(k),
 '微博':k=>'sinaweibo://searchall?q='+encodeURIComponent(k),
 'B站':k=>'bilibili://search?keyword='+encodeURIComponent(k),
 '苹果播客':k=>'pcast://search?term='+encodeURIComponent(k),
};
/* 苹果播客：直接落到搜索页（避开加载慢的 Browse 首页） */
const PODCAST_SEARCH='pcast://search';
function jumpChips(src,kw){
  let mains=[src];
  if(src==='小红书')mains.push('抖音');
  if(src==='抖音')mains.push('小红书');
  if(src==='微博')mains.push('百度');
  if(src==='播客平台'||src==='喜马拉雅')mains=['苹果播客','B站'];  // 播客：自带播客 + B站，两个都能用
  if(src==='学习强国'||src==='申材有道')mains.push('必应');
  if(src==='网络')mains.push('百度');
  if(src==='财经综合')mains.push('必应');
  return '<div class="jump-row">'+[...new Set(mains)].map(p=>
    `<button class="jump" data-p="${p}" data-k="${esc(kw)}">🔍${p}</button>`).join('')+'</div>';
}
/* 点击：PWA 内先尝试唤起 App；回退时用「新窗口」打开真 Safari（iOS 通用链接会自动跳进 App） */
function openInSafari(url){
  const a=document.createElement('a');
  a.href=url;a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
}
function doJump(p,k){
  const web=SEARCH_URLS[p](k);
  const scheme=(APP_SCHEMES[p]||(()=>null))(k);

function pick(arr,n,extra){const s=daySeed()+(extra||0)*7919;const a=[...arr];const out=[];let x=s;while(out.length<Math.min(n,a.length)){x=(x*9301+49297)%233280;const i=x%a.length;out.push(a.splice(i,1)[0]);}return out;}

/* ================= 实时金价（新浪财经行情接口） ================= */
const GOLD_CACHE_KEY='yunqi_gold_cache';
let GOLD={
  cny:'--',          // 沪金99 元/克
  cnyChg:'0',
  usd:'--',          // 伦敦金 美元/盎司
  usdChg:'0',
  silver:'--',       // 伦敦银 美元/盎司
  silverCny:'--',    // 折合 元/克
  time:'',           // 行情时间
  ok:false,
  updating:false,
};
try{const c=JSON.parse(localStorage.getItem(GOLD_CACHE_KEY)||'null');if(c)GOLD={...GOLD,...c};}catch(e){}
function saveGoldCache(){localStorage.setItem(GOLD_CACHE_KEY,JSON.stringify(GOLD));}

async function fetchGold(){
  if(GOLD.updating)return false;
  GOLD.updating=true;
  try{
    /* gold-api.com：支持 CORS，可浏览器直连；er-api：美元人民币汇率 */
    const [xauR,xagR,fxR]=await Promise.all([
      fetch('https://api.gold-api.com/price/XAU',{cache:'no-store'}),
      fetch('https://api.gold-api.com/price/XAG',{cache:'no-store'}),
      fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'}),
    ]);
    if(!xauR.ok)throw new Error('金价接口异常');
    const xau=await xauR.json();
    const xag=xagR.ok?await xagR.json():null;
    let fx=7.1;
    if(fxR.ok){
      const fxJson=await fxR.json();
      if(fxJson&&fxJson.rates&&fxJson.rates.CNY)fx=+fxJson.rates.CNY;
    }
    const usdPerOz=+xau.price;              // 美元/盎司
    if(!usdPerOz||isNaN(usdPerOz))throw new Error('金价空值');
    GOLD.usd=usdPerOz.toFixed(2);
    // 折算人民币/克（1 金衡盎司 = 31.1035 克），国内现货较国际有溢价，加约 0.6%
    GOLD.cny=(usdPerOz/31.1035*fx*1.006).toFixed(2);
    GOLD.cnyChg=(GOLD._lastCny&&+GOLD._lastCny>0
      ?(((usdPerOz/31.1035*fx)-(+GOLD._lastCny))/(+GOLD._lastCny)*100).toFixed(2)
      :'0.00');
    if(xag&&+xag.price>0){
      GOLD.silver=(+xag.price).toFixed(2);
      GOLD.silverCny=((+xag.price)/31.1035*fx).toFixed(2);
    }
    GOLD.fx=fx.toFixed(3);
    GOLD.time=new Date().toTimeString().slice(0,8);
    GOLD.ok=true;
    GOLD.date=new Date().toLocaleString('zh-CN',{hour12:false});
    GOLD._lastCny=GOLD.cny;
    saveGoldCache();GOLD.updating=false;
    if(current==='gold'||current==='home')render();
    return true;
  }catch(e){
    GOLD.updating=false;GOLD.err=e.message||'获取失败';
    if(current==='gold'||current==='home')render();
    return false;
  }
}
/* 兜底：无网络时用日期种子展示参考值 */
function goldToday(){
  if(GOLD.ok)return{
    cny:GOLD.cny,usd:GOLD.usd,silver:GOLD.silverCny,chg:GOLD.cnyChg,
    date:GOLD.date||today(),live:true,time:GOLD.time,
  };
  const s=daySeed();
  return{cny:(612.5+((s*7)%11-5)*0.9).toFixed(2),usd:'--',silver:'--',chg:'0.00',
    date:today(),live:false};
}

/* ================= 事件处理 ================= */
function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

document.getElementById('main').addEventListener('click',e=>{
  const btn=e.target.closest('[data-a]');
  if(btn){handleAction(btn);return;}
  const nc=e.target.closest('.nav-card');
  if(nc){current=nc.dataset.id;render();}
});

function handleAction(btn){
  const a=btn.dataset.a,i=+btn.dataset.i,t=today();
  const g=id=>document.getElementById(id);
  switch(current+'/'+a){
    case 'home/x': break;
    case 'plan/toggle':DB.plans[t][i].done=!DB.plans[t][i].done;save();render();break;
    case 'plan/pri':DB.plans[t][i].pri=!DB.plans[t][i].pri;save();render();break;
    case 'plan/del':DB.plans[t].splice(i,1);save();render();break;
    case 'plan/add':{const v=g('planIn').value.trim();if(!v)return toast('先写点什么吧 🌷');DB.plans[t]=DB.plans[t]||[];DB.plans[t].push({t:v,done:false,pri:g('planPri').value==='1'});save();render();break;}
    case 'sport/del':DB.sports[t].splice(i,1);save();render();break;
    case 'sport/add':{const n=g('spName').value.trim();const m=+g('spMin').value,c=+g('spCal').value;if(!n||!m)return toast('填写项目和时长哦');DB.sports[t]=DB.sports[t]||[];DB.sports[t].push({name:n,min:m,cal:c||0});save();render();break;}
    case 'money/addSpend':{const amt=+g('finAmt').value;if(!amt)return toast('填一下金额呀');DB.finance[t]=DB.finance[t]||{list:[],save:0};DB.finance[t].list=DB.finance[t].list||[];DB.finance[t].list.push({amount:amt,type:g('finCat').value,note:g('finNote').value.trim()});save();render();break;}
    case 'money/addSave':{const amt=+g('finSave').value;if(!amt)return toast('填一下金额呀');DB.finance[t]=DB.finance[t]||{list:[],save:0};DB.finance[t].save=(+DB.finance[t].save||0)+amt;save();render();break;}
    case 'money/delSpend':{DB.finance[t].list.splice(i,1);save();render();break;}
    case 'study/del':DB.study[t].splice(i,1);save();render();break;
    case 'study/add':{const v=g('stTask').value.trim();const m=+g('stMin').value;if(!v||!m)return toast('填内容和时长哦');DB.study[t]=DB.study[t]||[];DB.study[t].push({cat:g('stCat').value,task:v,min:m});save();render();toast('学完啦，你真棒 🌸');break;}
    case 'earn/del':DB.money[t].splice(i,1);save();render();break;
    case 'earn/check':DB.money[t][i].got=DB.money[t][i].got||0;DB.money[t][i].done=!DB.money[t][i].done;save();render();toast('打卡成功 💪');break;
    case 'earn/add':{const app=g('emApp').value.trim();const got=+g('emGot').value||0;if(!app)return toast('填写软件名称哦');DB.money[t]=DB.money[t]||[];DB.money[t].push({app,got});save();render();break;}
    case 'earn/setGoal':{const v=+g('emGoal').value;if(!v)return toast('填一下目标金额');DB.money.goal=v;save();render();break;}
    case 'save/delSave':DB.save[t].splice(i,1);save();render();break;
    case 'save/addSave':{const v=+g('svAmt').value;if(!v)return toast('填一下金额呀');DB.save[t]=DB.save[t]||[];DB.save[t].push({amount:v});save();render();break;}
    case 'save/setGoal':{const v=+g('svGoal').value;if(!v)return toast('填一下目标金额');DB.save.goal=v;save();render();break;}
    case 'save/addDebt':{const n=g('dbName').value.trim();const amt=+g('dbAmt').value;if(!n||!amt)return toast('填名称和金额哦');DB.save.debts=DB.save.debts||[];DB.save.debts.push({name:n,amount:amt,repaid:0});save();render();break;}
    case 'save/repay':{const d2=DB.save.debts[i];const remain=(+d2.amount||0)-(+d2.repaid||0);const v=prompt(`「${d2.name}」本次还款金额（剩余 ¥${remain}）`,remain);if(v===null)break;const r=Math.max(0,Math.min(+v||0,remain));if(!r)break;d2.repaid=(+d2.repaid||0)+r;save();render();break;}
    case 'save/delDebt':DB.save.debts.splice(i,1);save();render();break;
    case 'talk/addPh':{const q=g('phQ').value.trim(),ans=g('phA').value.trim();if(!q||!ans)return toast('场景和内容都要填哦');DB.phrases.unshift({cat:current||'职场',q,a:ans});save();render();break;}
    case 'talk/delPh':DB.phrases.splice(i,1);save();render();break;
    case 'sync/saveCfg':{SYNC_CFG={url:g('cfgUrl').value.trim(),key:g('cfgKey').value.trim(),uid:g('cfgUid').value.trim()||'yunqi'};localStorage.setItem(SYNC_CFG_KEY,JSON.stringify(SYNC_CFG));logSync('⚙️ 已保存同步配置');render();toast('配置已保存');break;}
    case 'sync/pushNow':pushCloud();break;
    case 'sync/pullNow':pullCloud();break;
    case 'sync/clearLog':SYNC_LOG=[];localStorage.setItem('yunqi_sync_log','[]');render();break;
    case 'gold/refreshGold':toast('正在获取实时行情…');fetchGold().then(ok=>{if(!ok)toast('获取失败，请检查网络');});break;
    case 'pod/shuffle':SHUFFLE.pod++;render();break;
    case 'hot/shuffle':SHUFFLE.hot++;render();break;
    case 'ai/shuffle':SHUFFLE.ai++;render();break;
  }
}

/* 其他交互：打卡按钮 / 搜索 / 分类 */
document.addEventListener('click',e=>{
  const j=e.target.closest('.jump');
  if(j){e.preventDefault();doJump(j.dataset.p,j.dataset.k);return;}
  if(e.target.id==='checkinBtn'){
    const t=today();
    if(DB.checkin[t]){delete DB.checkin[t];toast('已撤回今日打卡');}
    else{DB.checkin[t]=true;toast('打卡成功，今天也超棒 🌸');}
    save();render();
  }
  const pill=e.target.closest('.pill');
  if(pill){renderTalk._cat=pill.dataset.cat;render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='talkSearch'){renderTalk._kw=e.target.value;
    const list=document.getElementById('main');
    // 仅重渲染列表区域，避免输入框失焦
    setTimeout(()=>{const kw=renderTalk._kw;const main=document.getElementById('main');
      // 简化：重建整个页面但恢复焦点
      const pos=e.target.selectionStart;render();
      const inp=document.getElementById('talkSearch');if(inp){inp.focus();inp.setSelectionRange(pos,pos);}},0);
  }
});

/* ================= 主渲染 ================= */
function render(){
  renderNav();
  const m=document.getElementById('main');
  const map={home:renderHome,plan:renderPlan,sport:renderSport,money:renderFinance,pod:renderPod,study:renderStudy,hot:renderHot,ai:renderAI,earn:renderEarn,save:renderSave,talk:renderTalk,gold:renderGold,sync:renderSync};
  m.innerHTML=map[current]();
}

/* 时钟 + 每日零点自动刷新（跨天后自动切换当日模块，历史记录保留） */
let _curDate=today();
setInterval(()=>{
  const c=document.getElementById('clock');
  if(c)c.textContent=new Date().toTimeString().slice(0,8);
  if(today()!==_curDate){
    _curDate=today();
    render();
    toast('🌅 新的一天开始啦，今日模块已自动刷新');
  }
},1000);

/* 启动：渲染 + 开机自动拉取云端 */
render();
if(syncReady()){pullCloud(true);}
/* 实时金价：开机拉取 + 每 60 秒刷新一次 */
fetchGold();
setInterval(()=>{if(navigator.onLine)fetchGold();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchGold();});

/* PWA：注册 Service Worker（离线可用 + 可添加到主屏），并自动检测更新 */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
    reg.update();
    setInterval(()=>reg.update(),30*60*1000);
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          nw.postMessage('SKIP_WAITING');
          toast('🌸 已更新到最新版本');
          setTimeout(()=>location.reload(),800);
        }
      });
    });
  }).catch(()=>{});
  window.addEventListener('load',()=>{
    const cur=DB._ver||'';
    const V='v11';
    if(cur!==V){
      DB._ver=V;save();
      if(cur&&navigator.onLine)setTimeout(()=>location.reload(),300);
    }
  });
}
</script>
